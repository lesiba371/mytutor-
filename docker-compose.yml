services:
  # ── Production ──────────────────────────────────────────────────────────────
  # Builds the Expo web bundle and serves it via nginx.
  # Access at http://localhost:3000
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  # ── Development ─────────────────────────────────────────────────────────────
  # Hot-reload Expo web dev server.
  # Access at http://localhost:8081
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"
    volumes:
      # Mount source for hot-reload; keep container's node_modules
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev
